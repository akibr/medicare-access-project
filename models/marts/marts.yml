version: 2

models:
  - name: fct_specialty_bounds
    description: "One row per reported specialty: observed new-patient E/M service share, Scenario D and A suppression bounds, and flags."
    columns:
      - name: provider_type
        data_tests:
          - unique
          - not_null
      - name: scope_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['main', 'eye_care']

  - name: fct_specialty_pairs
    description: "One row per unordered pair of main-comparison specialties, with the suppression-robust ordering under Scenario D and A."
    columns:
      - name: ordering_d
        data_tests:
          - accepted_values:
              arguments:
                values: ['a_higher', 'b_higher', 'not_robust']
      - name: ordering_a
        data_tests:
          - accepted_values:
              arguments:
                values: ['a_higher', 'b_higher', 'not_robust']
