version: 2

models:
  - name: fct_specialty_bounds
    description: "One row per reported specialty: observed new-patient E/M service share, Scenario D and A suppression bounds, and flags."
    columns:
      - name: provider_type
        data_tests:
          - unique
          - not_null
      - name: scope_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['main', 'eye_care']

  - name: fct_specialty_pairs
    description: "One row per unordered pair of main-comparison specialties, with the suppression-robust ordering under Scenario D and A."
    columns:
      - name: ordering_d
        data_tests:
          - accepted_values:
              arguments:
                values: ['a_higher', 'b_higher', 'not_robust']
      - name: ordering_a
        data_tests:
          - accepted_values:
              arguments:
                values: ['a_higher', 'b_higher', 'not_robust']

  - name: fct_sensitivity_specialty
    description: "One row per sensitivity scenario and reported main-comparison specialty, with Scenario D bounds."
    columns:
      - name: scenario
        data_tests:
          - accepted_values:
              arguments:
                values: ['primary', 'incl_99211', 'cap_11_7', 'potential_eligibility']

  - name: fct_sensitivity_summary
    description: "One row per sensitivity scenario: providers, specialties, overall share and bounds, and robust pairs."
    columns:
      - name: scenario
        data_tests:
          - unique
          - not_null

