version: 2

models:
  - name: stg_cms__phys_2024
    description: "CMS by Provider and Service, typed. Grain: NPI x HCPCS code x place of service (tested in tests/assert_stg_phys_2024_grain_unique.sql)."
    columns:
      - name: npi
        data_tests:
          - not_null
      - name: hcpcs_code
        data_tests:
          - not_null
      - name: place_of_service
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'O']

  - name: stg_cms__phys_prov_2024
    description: "CMS by Provider, typed. Grain: one row per NPI."
    columns:
      - name: npi
        data_tests:
          - unique
          - not_null
      - name: entity_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['I', 'O']
