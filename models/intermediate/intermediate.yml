version: 2

models:
  - name: int_provider_em
    description: "One row per NPI with visible office/outpatient E/M and eye exam services, rows, and places of service."
    columns:
      - name: npi
        data_tests:
          - unique
          - not_null

  - name: int_provider_gap
    description: "One row per NPI in the by-Provider file, with G* (gap_services), the upper limit on suppressed services."
    columns:
      - name: npi
        data_tests:
          - unique
          - not_null
      - name: gap_basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['medical', 'total']
